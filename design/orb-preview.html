<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just Met, Capture Orb Preview</title>
<style>
  :root {
    --bg:#FAFAF7; --surface:#FFFFFF;
    --brand-green:#0B3D2E; --brand-primary:#12573F; --brand-hover:#166B4E;
    --gold:#D4AF37; --gold-text:#8A6A00;
    --text:#0A0A0A; --text-sec:rgba(0,0,0,.75); --dim:rgba(0,0,0,.60);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:-apple-system,'SF Pro Display',Inter,sans-serif; color:var(--text);
         display:flex; flex-direction:column; align-items:center; min-height:100vh; }

  /* phone frame */
  .phone { width:390px; height:760px; margin:24px 0 8px; background:var(--bg); border-radius:44px;
           box-shadow:0 0 0 10px #111, 0 24px 60px rgba(0,0,0,.25); overflow:hidden; position:relative;
           display:flex; flex-direction:column; align-items:center; }

  .prompt { margin-top:110px; text-align:center; padding:0 36px; }
  .prompt .hi { font-size:22px; font-weight:700; }
  .prompt .line { margin-top:8px; font-size:15px; color:var(--text-sec); line-height:1.5; }

  /* ORB */
  .orb-stage { position:relative; width:260px; height:260px; margin-top:44px; display:flex; align-items:center; justify-content:center; }

  .orb {
    width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--brand-hover) 0%, var(--brand-primary) 45%, var(--brand-green) 100%);
    box-shadow:0 10px 40px rgba(11,61,46,.35), inset 0 -8px 22px rgba(0,0,0,.25);
    animation:breathe 2.6s ease-in-out infinite;
    cursor:pointer; z-index:3;
  }
  @keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }

  /* soft green pulse halos, always on while listening */
  .halo { position:absolute; border-radius:50%; border:2px solid rgba(18,87,63,.35); width:150px; height:150px;
          animation:halo 2.6s ease-out infinite; z-index:1; }
  .halo.h2 { animation-delay:1.3s; }
  @keyframes halo { 0% { transform:scale(1); opacity:.7; } 100% { transform:scale(1.75); opacity:0; } }

  /* GOLD RING, only while actively hearing speech */
  .gold-ring { position:absolute; width:178px; height:178px; border-radius:50%; z-index:2;
               border:3px solid var(--gold);
               box-shadow:0 0 24px rgba(212,175,55,.55), inset 0 0 14px rgba(212,175,55,.35);
               opacity:0; transform:scale(.92); transition:opacity .25s ease, transform .25s ease; }
  .hearing .gold-ring { opacity:1; transform:scale(1); animation:goldpulse 1.1s ease-in-out infinite; }
  @keyframes goldpulse { 0%,100% { box-shadow:0 0 18px rgba(212,175,55,.45); transform:scale(1);} 50% { box-shadow:0 0 34px rgba(212,175,55,.8); transform:scale(1.045);} }

  /* gold equalizer ticks around ring while hearing */
  .hearing .orb { animation:breathe 1.1s ease-in-out infinite; }

  .transcript { margin-top:40px; min-height:54px; padding:0 36px; text-align:center; font-size:15px; color:var(--dim); font-style:italic; }
  .transcript b { color:var(--text-sec); font-style:normal; }

  .status { position:absolute; bottom:96px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-text); opacity:0; transition:opacity .3s; }
  .hearing .status { opacity:1; }

  .hint { position:absolute; bottom:40px; font-size:13px; color:var(--dim); }

  /* countdown overlay */
  .overlay { position:absolute; inset:0; background:rgba(250,250,247,.96); display:flex; flex-direction:column; align-items:center; justify-content:center;
             opacity:0; pointer-events:none; transition:opacity .3s; z-index:10; }
  .overlay.show { opacity:1; pointer-events:auto; }
  .overlay .ready { font-size:20px; font-weight:700; color:var(--brand-primary); }
  .overlay .num { font-size:110px; font-weight:800; color:var(--brand-green); line-height:1.1; min-height:130px; }
  .overlay .sub { font-size:14px; color:var(--dim); }

  /* controls under the phone */
  .controls { display:flex; gap:12px; margin:18px 0 40px; }
  button { height:52px; padding:0 24px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer;
           transition:transform .18s cubic-bezier(.34,1.56,.64,1); }
  button:active { transform:scale(.952); }
  .primary { border:none; color:#fff; background:linear-gradient(180deg, var(--brand-hover), var(--brand-primary), var(--brand-green)); }
  .secondary { background:var(--surface); border:1px solid #8F8F8F; color:var(--brand-primary); }
  .caption { font-size:12px; color:var(--dim); margin-bottom:8px; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="prompt">
    <div class="hi">Hi! I'm listening.</div>
    <div class="line">Say your name, number, company and what we talked about.</div>
  </div>

  <div class="orb-stage">
    <div class="halo"></div>
    <div class="halo h2"></div>
    <div class="gold-ring"></div>
    <div class="orb" id="orb" title="Tap to stop"></div>
  </div>

  <div class="transcript" id="transcript"></div>
  <div class="status">hearing you</div>
  <div class="hint">tap the orb to stop</div>

  <div class="overlay" id="overlay">
    <div class="ready">Ready for selfie</div>
    <div class="num" id="num">3</div>
    <div class="sub">extraction already running in the background</div>
  </div>
</div>

<div class="caption">Simulate states:</div>
<div class="controls">
  <button class="secondary" onclick="setIdle()">Listening (idle)</button>
  <button class="primary" onclick="startSpeech()">They start speaking</button>
  <button class="secondary" onclick="stopAndCountdown()">Stop &rarr; 3, 2, 1</button>
</div>

<script>
  const phone = document.getElementById('phone');
  const transcript = document.getElementById('transcript');
  const overlay = document.getElementById('overlay');
  const num = document.getElementById('num');
  const WORDS = "Hi I'm Sarah Chen ... plus nine seven one five five five two four one eight ... I run partnerships at Falcon Ventures ... we talked about the Dubai padel league".split(' ');
  let timer = null, i = 0;

  function clearTimer(){ if (timer) { clearInterval(timer); timer = null; } }

  function setIdle(){
    clearTimer(); overlay.classList.remove('show');
    phone.classList.remove('hearing');
    transcript.innerHTML = '';
    i = 0;
  }

  function startSpeech(){
    clearTimer(); overlay.classList.remove('show');
    phone.classList.add('hearing');
    i = 0; transcript.innerHTML = '';
    timer = setInterval(() => {
      if (i >= WORDS.length) { phone.classList.remove('hearing'); clearTimer(); return; }
      transcript.innerHTML = '<b>' + WORDS.slice(Math.max(0, i-18), i+1).join(' ') + '</b>&hellip;';
      i++;
    }, 220);
  }

  function stopAndCountdown(){
    clearTimer(); phone.classList.remove('hearing');
    overlay.classList.add('show');
    let n = 3;
    num.textContent = n;
    timer = setInterval(() => {
      n--;
      if (n > 0) { num.textContent = n; }
      else if (n === 0) { num.textContent = 'GO'; }
      else { clearTimer(); overlay.classList.remove('show'); setIdle(); }
    }, 800);
  }

  document.getElementById('orb').addEventListener('click', stopAndCountdown);
</script>
</body>
</html>
